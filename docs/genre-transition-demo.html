<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Переход между жанрами — варианты</title>
<style>
  @property --a { syntax: '<color>'; inherits: true; initial-value: #FF6A3D; }
  :root { --bg: #110E0D; --panel: #1B1716; --cell: #29221F; --text: #F6F0E9; --muted: #B3A79D;
          --salsa: #FF6A3D; --bachata: #2FC6B4; --gold: #F4C552; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px; }
  .picker { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 4px; }
  .picker button { border: 1px solid #3A322E; background: transparent; color: var(--muted); border-radius: 999px; padding: 8px 14px; font: inherit; cursor: pointer; }
  .picker button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 700; }
  .note { color: var(--muted); min-height: 3em; margin: 6px 0 14px; max-width: 70ch; }
  .note b { color: var(--text); }

  /* The mock genre page */
  .stage { position: relative; overflow: hidden; border-radius: 20px; background: var(--bg); border: 1px solid #29221F; padding: 20px; min-height: 430px; }
  .page { --a: var(--salsa); transition: --a 450ms ease; }
  .page[data-genre="bachata"] { --a: var(--bachata); }
  .nav { display: flex; align-items: center; gap: 14px; }
  .back { color: #8A7E74; font-size: 14px; }
  .switch { position: relative; display: flex; gap: 4px; background: var(--panel); border-radius: 999px; padding: 4px; }
  .switch a { position: relative; z-index: 1; padding: 6px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; text-decoration: none; user-select: none; }
  .switch a.on { color: #110E0D; font-weight: 700; }
  /* The labels ride above the moving pill during a view transition. */
  .switch a[data-to="salsa"] { view-transition-name: tab-salsa; }
  .switch a[data-to="bachata"] { view-transition-name: tab-bachata; }
  .pill { position: absolute; top: 4px; bottom: 4px; border-radius: 999px; background: var(--a); view-transition-name: pill; }
  h1 { font-size: clamp(40px, 8vw, 64px); margin: 10px 0 18px; letter-spacing: -0.03em; line-height: 1; view-transition-name: title; }
  .grid { display: grid; gap: 6px; view-transition-name: grid; }
  .row { display: grid; grid-template-columns: 90px repeat(16, 1fr); gap: 3px; align-items: center; }
  .row span:first-child { font-size: 12px; color: var(--muted); }
  .c { height: 22px; border-radius: 5px; background: var(--cell); }
  .c.hit { background: var(--a); }
  .c.one { box-shadow: inset 0 0 0 2px var(--gold); }
  .play { margin-top: 18px; display: inline-flex; padding: 12px 22px; border-radius: 16px; background: var(--a); color: #110E0D; font-weight: 800; view-transition-name: play; }

  /* Variant 1: circle curtain (today) */
  .curtain { position: absolute; border-radius: 50%; pointer-events: none; will-change: transform, opacity; visibility: hidden; z-index: 5; }

  /* Variant 4: wipe band */
  .wipe { position: absolute; inset: 0; pointer-events: none; z-index: 5; visibility: hidden; will-change: transform;
          background: linear-gradient(90deg, transparent 0, var(--to) 18%, var(--to) 82%, transparent 100%); }

  /* View Transitions shared by variants 2 and 3 */
  ::view-transition-group(*) { animation-duration: 420ms; animation-timing-function: cubic-bezier(.2,.7,.1,1); }
  ::view-transition-old(root), ::view-transition-new(root) { animation: none; }
  .vt-slide::view-transition-old(grid) { animation: 180ms cubic-bezier(.4,0,1,1) both out-x; }
  .vt-slide::view-transition-new(grid) { animation: 360ms cubic-bezier(.2,.7,.1,1) 140ms both in-x; }
  .vt-slide::view-transition-old(title) { animation: 160ms cubic-bezier(.4,0,1,1) both out-x; }
  .vt-slide::view-transition-new(title) { animation: 360ms cubic-bezier(.2,.7,.1,1) 100ms both in-x; }
  .vt-morph::view-transition-old(grid), .vt-morph::view-transition-old(title) { animation: 160ms ease-in both fade-out; }
  .vt-morph::view-transition-new(grid) { animation: 360ms cubic-bezier(.2,.7,.1,1) 140ms both rise; }
  .vt-morph::view-transition-new(title) { animation: 360ms cubic-bezier(.2,.7,.1,1) 100ms both rise; }
  @keyframes out-x { to { opacity: 0; transform: translateX(calc(var(--dir, 1) * -48px)); } }
  @keyframes in-x { from { opacity: 0; transform: translateX(calc(var(--dir, 1) * 48px)); } }
  @keyframes fade-out { to { opacity: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }

  .perf { margin-top: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
  .perf div { background: var(--panel); border-radius: 14px; padding: 12px 14px; color: var(--muted); font-size: 14px; }
  .perf b { color: var(--text); display: block; margin-bottom: 2px; }
  @media (max-width: 560px) { .row { grid-template-columns: 56px repeat(16, 1fr); gap: 2px; } .c { height: 16px; } }
  @media (prefers-reduced-motion: reduce) { .page { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <h2 style="margin:8px 0 4px">Переход сальса ↔ бачата: варианты</h2>
  <div class="picker" role="group" aria-label="Вариант">
    <button data-v="curtain">1 · Шторка (сейчас)</button>
    <button data-v="slide" aria-pressed="true">2 · Слайд</button>
    <button data-v="morph">3 · Перетекание</button>
    <button data-v="wipe">4 · Волна</button>
  </div>
  <p class="note" id="note"></p>

  <div class="stage" id="stage">
    <div class="page" id="page" data-genre="salsa">
      <div class="nav">
        <span class="back">← Назад</span>
        <div class="switch" id="switch">
          <span class="pill" id="pill"></span>
          <a data-to="salsa" class="on">Сальса</a>
          <a data-to="bachata">Бачата</a>
        </div>
      </div>
      <h1 id="title">Сальса</h1>
      <div class="grid" id="grid"></div>
      <span class="play">▶ Играть</span>
    </div>
  </div>

  <div class="perf" id="perf"></div>
</div>

<script>
const GENRES = {
  salsa: { name: 'Сальса', color: '#FF6A3D', rows: [
    ['Клаве', [0, 3, 6, 10, 12]], ['Конга', [3, 6, 7, 11, 14, 15]], ['Бонго', [0, 2, 4, 6, 8, 10, 12, 14]],
    ['Кампана', [0, 4, 8, 12]], ['Бас', [3, 6, 11, 14]], ['Пиано', [0, 3, 5, 8, 11, 13]] ] },
  bachata: { name: 'Бачата', color: '#2FC6B4', rows: [
    ['Гитара', [0, 2, 4, 6, 8, 10, 12, 14]], ['Бонго', [0, 1, 2, 3, 4, 5, 6, 8, 9, 10, 11, 12, 13, 14]],
    ['Гуира', [0, 2, 3, 4, 6, 8, 10, 11, 12, 14]], ['Бас', [0, 3, 6, 8, 11, 14]], ['Бонго тон', [6, 14]] ] },
}
const NOTES = {
  curtain: '<b>Шторка.</b> Круг цвета жанра закрывает экран, под ним меняется страница. Эффектно, но на секунду прячет всё, и это ощущается как переход на другой сайт, а не внутри приложения.',
  slide: '<b>Слайд (рекомендую).</b> Плашка переключателя переезжает на другой жанр, акцентный цвет перетекает, заголовок и сетка уезжают в сторону жанра (сальса слева, бачата справа). Читается как вкладки одного приложения. Делается на View Transitions API: браузер сам анимирует снимки старой и новой страницы на GPU.',
  morph: '<b>Перетекание.</b> Ничего не уезжает: плашка переезжает, цвет плавно меняется, старое содержимое гаснет, новое поднимается на 12px. Самый спокойный вариант, хорош при частом переключении.',
  wipe: '<b>Волна.</b> Полоса цвета нового жанра проходит по экрану слева направо (или обратно), под ней меняется страница. Видна смена «мира» жанра, но экран не закрывается целиком, как при шторке.',
}
const PERF = [
  ['Только transform и opacity', 'Все варианты двигают слои на GPU, без пересчёта раскладки на каждом кадре.'],
  ['Тяжёлое — под прикрытием', 'Новая сетка монтируется, пока виден снимок или полоса, а не посреди анимации.'],
  ['Звуки заранее', 'Сэмплы другого жанра грузятся при наведении на переключатель, чтобы Play сработал сразу.'],
  ['Без движения — без анимации', 'Если включено «Уменьшить движение» или выключена анимация, остаётся мгновенная смена.'],
]
document.getElementById('perf').innerHTML = PERF.map(([t, d]) => `<div><b>${t}</b>${d}</div>`).join('')

const page = document.getElementById('page'), stage = document.getElementById('stage')
const pill = document.getElementById('pill'), sw = document.getElementById('switch')
let variant = 'slide', genre = 'salsa', busy = false
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches

function render(id) {
  const g = GENRES[id]
  page.dataset.genre = id
  document.getElementById('title').textContent = g.name
  document.getElementById('grid').innerHTML = g.rows.map(([n, hits]) =>
    `<div class="row"><span>${n}</span>${Array.from({ length: 16 }, (_, i) =>
      `<span class="c${hits.includes(i) ? ' hit' : ''}${i === 0 || i === 8 ? ' one' : ''}"></span>`).join('')}</div>`).join('')
  for (const a of sw.querySelectorAll('a')) a.classList.toggle('on', a.dataset.to === id)
  placePill()
}
function placePill() {
  const on = sw.querySelector('a.on')
  pill.style.left = on.offsetLeft + 'px'; pill.style.width = on.offsetWidth + 'px'
}
const center = (el) => { const b = el.getBoundingClientRect(), s = stage.getBoundingClientRect(); return { x: b.left - s.left + b.width / 2, y: b.top - s.top + b.height / 2 } }

async function go(to, tab) {
  if (to === genre || busy) return
  busy = true
  const dir = to === 'bachata' ? 1 : -1
  genre = to
  try {
    if (reduce) render(to)
    else if (variant === 'curtain') await curtain(to, tab)
    else if (variant === 'wipe') await wipe(to, dir)
    else await viewTransition(to, dir)
  } finally { busy = false }
}

async function viewTransition(to, dir) {
  const root = document.documentElement
  root.style.setProperty('--dir', dir)
  if (!document.startViewTransition) {
    // Fallback: the same idea by hand.
    const grid = document.getElementById('grid')
    await grid.animate([{ opacity: 1 }, { opacity: 0, transform: variant === 'slide' ? `translateX(${-48 * dir}px)` : 'none' }], { duration: 200, fill: 'forwards' }).finished
    render(to)
    await grid.animate([{ opacity: 0, transform: variant === 'slide' ? `translateX(${48 * dir}px)` : 'translateY(12px)' }, { opacity: 1, transform: 'none' }], { duration: 380, easing: 'cubic-bezier(.2,.7,.1,1)' }).finished
    return
  }
  root.classList.add(variant === 'slide' ? 'vt-slide' : 'vt-morph')
  const t = document.startViewTransition(() => render(to))
  await t.finished.catch(() => {})
  root.classList.remove('vt-slide', 'vt-morph')
}

async function curtain(to, tab) {
  const { x, y } = center(tab), w = stage.clientWidth, h = stage.clientHeight
  const r = Math.ceil(Math.hypot(Math.max(x, w - x), Math.max(y, h - y))), size = r * 2
  const el = Object.assign(document.createElement('div'), { className: 'curtain' })
  Object.assign(el.style, { left: x - r + 'px', top: y - r + 'px', width: size + 'px', height: size + 'px', background: GENRES[to].color, visibility: 'visible' })
  stage.append(el)
  await el.animate([{ transform: `scale(${32 / size})` }, { transform: 'none' }], { duration: 420, easing: 'cubic-bezier(.2,.7,.1,1)', fill: 'forwards' }).finished
  render(to)
  await el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 260, fill: 'forwards' }).finished
  el.remove()
}

async function wipe(to, dir) {
  const el = Object.assign(document.createElement('div'), { className: 'wipe' })
  el.style.setProperty('--to', GENRES[to].color); el.style.visibility = 'visible'
  el.style.width = '160%'; el.style.left = '-30%'
  stage.append(el)
  const w = stage.clientWidth * 1.6
  const from = -w * dir, mid = 0, end = w * dir
  await el.animate([{ transform: `translateX(${from}px)` }, { transform: `translateX(${mid}px)` }], { duration: 300, easing: 'cubic-bezier(.4,0,.6,1)', fill: 'forwards' }).finished
  render(to)
  await el.animate([{ transform: `translateX(${mid}px)` }, { transform: `translateX(${end}px)` }], { duration: 340, easing: 'cubic-bezier(.2,.7,.1,1)', fill: 'forwards' }).finished
  el.remove()
}

sw.addEventListener('click', (e) => { const a = e.target.closest('a'); if (a) go(a.dataset.to, a) })
const note = document.getElementById('note')
for (const b of document.querySelectorAll('.picker button')) b.addEventListener('click', () => {
  variant = b.dataset.v
  for (const o of document.querySelectorAll('.picker button')) o.setAttribute('aria-pressed', o === b)
  note.innerHTML = NOTES[variant]
})
note.innerHTML = NOTES[variant]
render('salsa')
addEventListener('resize', placePill)
</script>
</body>
</html>
